services:
  moses:
    image: ubuntu:26.04
    container_name: moses
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    working_dir: /home/bin/
    command: ./moses
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - ./:/home/bin/
