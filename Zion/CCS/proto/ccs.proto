syntax = "proto3";


package ccs;

option optimize_for = LITE_RUNTIME;
option csharp_namespace = "CC.Proto";


enum MessageType {
    MT_None   = 0;
    MT_Text   = 1;
    MT_Image  = 2;
    MT_File   = 3;
    MT_Audio  = 4;
    MT_Video  = 5;
    MT_Pdf    = 6;

    MT_Edit   = 100;
    MT_Revoke = 101;
}


message SingleChatReq {
    uint64      cli_id     = 1;   // 客户端幂等
    uint32      to_id      = 2;   // 单聊对端 uid
    MessageType type       = 3;
    string      content    = 4;   // 文本为原文; 富媒体为 JSON(存对象 key); 编辑时为新内容
    int64       target_id  = 5;   // 仅编辑/撤回: 目标 msg_id, 服务端校验防拿错行
    int64       target_seq = 6;   // 仅编辑/撤回: 目标 seq, 服务端 seq/10000 定位分区
}


message SingleChatRsp {
    int32  code       = 1;   // 0 成功, 其余见错误码表
    uint64 cli_id     = 2;
    int64  seq        = 3;
    int64  msg_id     = 4;
    int64  created_at = 5;
}


message SingleChatNtf {
    uint64      cli_id     = 1;
    int64       seq        = 2;
    int64       msg_id     = 3;
    MessageType type       = 4;
    string      content    = 5;
    int64       created_at = 6;
    uint32      from_id    = 7;
}


message ClearChatReq {
    uint32 peer_id    = 1;
    uint64 idempotent = 2;
}


message ClearChatRsp {
    int32  code    = 1;
    uint64 chat_id = 2;
}


message ClearChatNtf {
    uint64 chat_id = 1;
}


message DeleteChatCursorReq {
    uint32 peer_id    = 1;
    uint64 idempotent = 2;
}

message DeleteChatCursorRsp {
    int32  code    = 1;
    uint64 chat_id = 2;
}


message DeleteChatCursorNtf {
    uint64 chat_id = 1;
}


message ConfirmChatReq {
    uint32 peer_id    = 1;
    int64  seq        = 2;
    uint64 idempotent = 3;
}


message ConfirmChatRsp {
    int32  code    = 1;
    uint64 chat_id = 2;
}


message ConfirmChatNtf {
    uint64 chat_id = 1;
    int64  seq     = 2;
}


message ChatCursorItem {
    uint32 user_id   = 1;
    uint64 chat_id   = 2;
    int64  last_seq  = 3;
    int64  last_time = 4;
    int64  read_seq  = 5;
    int64  peer_read_seq = 9;
    int64  recv_seq  = 6;
    bool   is_pinned = 7;
    bool   is_muted  = 8;
}


message ChatMsg {
    uint64      chat_id    = 1;
    int32       bucket     = 2;
    int64       seq        = 3;
    int64       msg_id     = 4;
    uint64      cli_id     = 5;
    uint32      from_id    = 6;
    uint32      to_id      = 7;
    MessageType msg_type   = 8;
    string      content    = 9;
    int64       target_id  = 10;
    int64       edit_seq   = 11;
    int64       edited_at  = 12;
    bool        is_revoked = 13;
    int64       created_at = 14;
}


message GetChatCursorReq {
}


message GetChatCursorRsp {
    int32                   code    = 1;
    repeated ChatCursorItem cursors = 2;
}


message GetChatMessageReq {
    uint64 chat_id    = 1;
    int64  before_seq = 2;
    int32  limit      = 3;
}


message GetChatMessageRsp {
    int32            code     = 1;
    uint64           chat_id  = 2;
    bool             has_more = 3;
    repeated ChatMsg messages = 4;
}